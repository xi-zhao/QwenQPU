<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#63e5d3"/></marker></defs><rect width="1400" height="650" fill="#0b1219"/>
<text x="46" y="63" fill="#edf3f5" font-family="DIN Condensed,DejaVu Sans Condensed,sans-serif" font-size="38" font-weight="700">THE EXECUTION PATH</text>
<text x="46" y="100" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="21" font-weight="400">Explicit host scheduling. A separate quantum state. No decoder / KV fusion.</text>
<rect x="46" y="190" width="225" height="148" rx="14" fill="#101d28" stroke="#ffae69"/>
<text x="64" y="227" fill="#ffae69" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="24" font-weight="600">Qwen</text>
<text x="64" y="263" fill="#edf3f5" font-family="Menlo,monospace" font-size="16" font-weight="400">language.generate</text>
<text x="64" y="294" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Propose circuit JSON</text>
<rect x="307" y="190" width="211" height="148" rx="14" fill="#101d28" stroke="#92aab7"/>
<text x="325" y="227" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="24" font-weight="600">Host</text>
<text x="325" y="263" fill="#edf3f5" font-family="Menlo,monospace" font-size="16" font-weight="400">validate + encode</text>
<text x="325" y="294" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Supply seeded uniforms</text>
<rect x="554" y="151" width="330" height="266" rx="14" fill="#101d28" stroke="#63e5d3"/>
<text x="572" y="188" fill="#63e5d3" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="24" font-weight="600">Fixed quantum module</text>
<text x="572" y="224" fill="#edf3f5" font-family="Menlo,monospace" font-size="16" font-weight="400">QwenQPU.forward</text>
<text x="572" y="255" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="16" font-weight="400">TorchScript control</text>
<rect x="920" y="190" width="204" height="148" rx="14" fill="#101d28" stroke="#92aab7"/>
<text x="938" y="227" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="24" font-weight="600">Host</text>
<text x="938" y="263" fill="#edf3f5" font-family="Menlo,monospace" font-size="16" font-weight="400">aggregate bits</text>
<text x="938" y="294" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Return counts only</text>
<rect x="1160" y="190" width="194" height="148" rx="14" fill="#101d28" stroke="#ffae69"/>
<text x="1178" y="227" fill="#ffae69" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="24" font-weight="600">Qwen</text>
<text x="1178" y="263" fill="#edf3f5" font-family="Menlo,monospace" font-size="16" font-weight="400">language.generate</text>
<text x="1178" y="294" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="16" font-weight="400">Report the counts</text>
<text x="574" y="301" fill="#edf3f5" font-family="Menlo,monospace" font-size="17" font-weight="400">address → local 4×4 linear</text>
<text x="574" y="333" fill="#edf3f5" font-family="Menlo,monospace" font-size="17" font-weight="400">mask → state writeback</text>
<text x="574" y="365" fill="#edf3f5" font-family="Menlo,monospace" font-size="17" font-weight="400">CDF → terminal sampling</text>
<text x="574" y="397" fill="#63e5d3" font-family="Menlo,monospace" font-size="17" font-weight="400">FP32 state: [2^n, 2]</text>
<path d="M275 264 H298" stroke="#63e5d3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M522 264 H545" stroke="#63e5d3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M888 264 H911" stroke="#63e5d3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1128 264 H1151" stroke="#63e5d3" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M46 468 H1354" stroke="#233744"/>
<text x="46" y="512" fill="#63e5d3" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="16" font-weight="600">NETWORK</text>
<text x="180" y="512" fill="#edf3f5" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Gate selection, state updates and bitstring selection happen in the scripted module.</text>
<text x="46" y="552" fill="#ffae69" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="16" font-weight="600">HOST</text>
<text x="180" y="552" fill="#edf3f5" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="20" font-weight="400">Parsing, repeat expansion, RNG and counts aggregation remain in the driver.</text>
<text x="46" y="604" fill="#92aab7" font-family="Avenir Next,DejaVu Sans,sans-serif" font-size="18" font-weight="400">Qiskit is an offline test oracle. No external simulator executes production circuits.</text>
</svg>